<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV 線上直播</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column; /* 關鍵：讓網頁元件改為上下排列 */
            height: 100vh;
            background-color: #1a1a1a;
            color: #fff;
        }
        
        /* 上側播放區 */
        .main-content {
            width: 100%;
            height: 60vh; /* 設定播放區域佔螢幕高度的 60% */
            background-color: #111;
            position: relative;
        }
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 下側選單 */
        .sidebar {
            flex: 1; /* 自動填滿剩餘的下方空間 */
            width: 100%;
            background-color: #2d2d2d;
            overflow-y: auto;
            border-top: 1px solid #444; /* 改為上邊框分隔線 */
        }
        .sidebar h2 {
            padding: 15px;
            font-size: 1.1rem;
            text-align: center;
            background-color: #ff3333;
            color: white;
            position: sticky; /* 讓標題固定在選單最上方 */
            top: 0;
            z-index: 10;
        }
        .channel-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            background: none;
            border: none;
            color: #ddd;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 1px solid #3d3d3d;
            transition: background 0.2s;
        }
        .channel-btn:hover {
            background-color: #3d3d3d;
            color: #fff;
        }
        .channel-btn.active {
            background-color: #ff3333;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 上側播放區域 -->
    <div class="main-content">
        <div class="video-container">
            <!-- 預設改為 CCTV9 連結 -->
            <iframe id="live-player" src="https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=7252237247689203957" allowfullscreen></iframe>
        </div>
    </div>

    <!-- 下側頻道選擇 -->
    <div class="sidebar">
        <h2>CCTV 直播源</h2>
        <!-- 調整至最前面並預設為 active -->
        <button class="channel-btn active" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=7252237247689203957')">CCTV9 紀錄</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=14589146016461298119')">CCTV10 科教</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=16265686808730585228')">CCTV13 新聞</button>
        
        <!-- 以下保持原來的順序 -->
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=11200132825562653886')">CCTV1 綜合</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=12030532124776958103')">CCTV2 財經</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=10620168294224708952')">CCTV4 中文國際</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=8516529981177953694')">CCTV7 國防軍事</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=13180385922471124325')">CCTV12 社會與法</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=4496917190172866934')">CCTV17 農業農村</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=2127841942201075403')">CCTV4K 超高清</button>
    </div>

    <script>
        function changeChannel(button, url) {
            document.getElementById('live-player').src = url;
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }
    </script>
</body>
</html>
