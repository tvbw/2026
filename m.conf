# ============================================================
# Ugoos AM8 (S928X-J, 4GB RAM, Android 14) mpv.conf
# 默认方案：mediacodec-copy 稳妥硬解 + 色彩优化
# ============================================================

# ---- 渲染与色彩 ----
vo=gpu-next
gpu-context=android
gpu-api=opengl

# 向显示设备提示目标色彩空间，改善 HDR/SDR 映射
# 若出现 HDR 切换闪屏或黑屏，把下一行改为 no
target-colorspace-hint=yes

# 降低高光去饱和强度，让高光区域保留更多色彩
# 默认约 0.75，0.5 更鲜艳；若高光溢出可回调到 0.6
tone-mapping-desaturate=0.5

# ---- 硬解 ----
hwdec=mediacodec-copy
hwdec-codecs=hevc,h264,av1,vp9

# ---- 渲染预设：降低缩放和后处理负载 ----
profile=fast

# ---- 缓存：4GB 内存下的保守值 ----
cache=yes
cache-secs=10
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=64MiB
demuxer-readahead-secs=8
cache-pause=no

# ---- 网络与起播 ----
network-timeout=15
stream-buffer-size=4MiB
stream-lavf-o=reconnect=1,reconnect_delay_max=5,multiple_requests=1

demuxer-lavf-analyzeduration=0.2
demuxer-lavf-probe-info=nostreams

# ---- 字幕 ----
sub-auto=fuzzy

# 有 ASS 特效字幕需求时取消下一行注释
# sub-ass-override=no

# ---- 音频 ----
# AM8 上不要开启 audio-spdif 直通，已知会导致视频卡首帧
audio-channels=auto-safe

# ---- 渲染减负 ----
interpolation=no
tscale=none
video-sync=audio
