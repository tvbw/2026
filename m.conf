# ============================================================
# WebHTV 默认基底 + 温和画质追加
# 不修改 vo / hwdec / profile，保留 WebHTV 内部协商逻辑
# ============================================================

# ---- WebHTV 默认项（完全保留） ----
profile=fast
http-allow-redirect=yes
sub-ass=yes
sub-ass-override=scale
embeddedfonts=yes
sub-fix-timing=yes
sub-use-margins=yes
sub-font-provider=fontconfig
volume-max=100

# ---- 追加：色彩映射微调（仅在 gpu/gpu-next 路径下生效，不干扰解码） ----
target-colorspace-hint=yes
tone-mapping-desaturate=0.6

# ---- 追加：缩放抗振铃，减少缩放边缘伪影 ----
scale-antiring=0.7

# ---- 追加：温和去色带（针对流媒体高压缩片源的色块/色带） ----
deband=yes
deband-iterations=2
deband-threshold=32
deband-grain=16
